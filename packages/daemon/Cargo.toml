[package]
name = "telayd-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "telayd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["trace"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }

# Crypto / token
getrandom = "0.2"
base64 = "0.22"
subtle = "2"

# XDG paths
directories = "5"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async channel / task
# tokio-util 0.7 does not have a "sync" feature; CancellationToken is included
# in the default feature set. "io" is required for codec helpers.
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# HTTP client (for cloudflared download)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Sha2 for cloudflared verify
sha2 = "0.10"
hex = "0.4"

# Bytes (axum ws Ping payload)
bytes = "1"

# File operations
tempfile = "3"

# Unix IPC
tokio-stream = "0.1"

# Archive extraction (cloudflared install)
flate2 = "1"
tar = "0.4"

# Process signal (SIGTERM/SIGKILL for cloudflared)
# "fs" required for nix::fcntl::Flock (IG6: PID file locking)
# and nix::sys::stat::umask (IG7: global umask 0o077, safe Rust).
# nix 0.29: stat module is under the "fs" feature (sys/mod.rs).
nix = { version = "0.29", features = ["signal", "process", "fs"] }

# libc: O_NOFOLLOW constant for config.rs single-syscall open (IG7 TOCTOU fix).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
# L0 prototype: many stub items exist for future use.
# These will be wired in L1+; suppressed here to unblock the build gate.
dead_code = "allow"
unused_imports = "allow"
unused_mut = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common patterns that clippy pedantic dislikes
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pre-existing patterns acknowledged below (IG7: build gate baseline).
# These are L0 prototype patterns that will be cleaned up in a later sweep.
doc_markdown = "allow"
redundant_closure_for_method_calls = "allow"
items_after_statements = "allow"
map_unwrap_or = "allow"
option_if_let_else = "allow"
manual_string_new = "allow"
useless_conversion = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
collapsible_str_replace = "allow"
single_char_pattern = "allow"
explicit_iter_loop = "allow"
match_wildcard_for_single_variants = "allow"
let_underscore_untyped = "allow"
manual_range_contains = "allow"
unnecessary_debug_formatting = "allow"
result_map_or_into_option = "allow"
option_map_unwrap_or_else = "allow"
manual_is_variant_and = "allow"
assigning_clones = "allow"
# Dead code is expected in L0 prototype (stub modules, future-use APIs).
dead_code = "allow"
# format_string variables — will migrate in a later sweep.
uninlined_format_args = "allow"
# match patterns
wildcard_in_or_patterns = "allow"
match_single_binding = "allow"
# open_without_truncate: all file opens in L0 are intentional append/create.
open_without_truncate = "allow"
# let_else: pre-existing match patterns; migrate in later sweep.
single_match_else = "allow"
question_mark = "allow"
map_or_else = "allow"
# Remaining pre-existing lint suppression (IG7 baseline)
await_holding_lock = "allow"
ignored_unit_patterns = "allow"
manual_let_else = "allow"
unnecessary_map_or = "allow"
suspicious_open_options = "allow"
